<div class="charMemory_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>CharMemory</b>
            <span id="charMemory_openWizard" class="charMemory_headerGear" title="設置嚮導">
                <i class="fa-solid fa-wand-magic-sparkles fa-sm"></i>
            </span>
            <span id="charMemory_openTroubleshooter" class="charMemory_headerGear" title="故障排除">
                <i class="fa-solid fa-screwdriver-wrench fa-sm"></i>
            </span>
            <span id="charMemory_openSettingsModal" class="charMemory_headerGear" title="打開設置">
                <i class="fa-solid fa-gear fa-sm"></i>
            </span>
            <span id="charMemory_toggleInjectionBtn" class="charMemory_headerGear" title="切換注入查看器">
                <i class="fa-solid fa-syringe fa-sm"></i>
            </span>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">

            <!-- Nudge banner -->
            <div id="charMemory_nudgeBanner" class="charMemory_nudgeBanner" style="display:none;">
                <i class="fa-solid fa-triangle-exclamation fa-sm"></i>
                <span>需要注意某些事項</span>
                <input type="button" id="charMemory_nudgeFix" class="menu_button" value="查看" />
            </div>

            <!-- Stats bar -->
            <div class="charMemory_statsBar">
                <div class="charMemory_statItem" title="存儲此角色記憶的數據庫文件">
                    <i class="fa-solid fa-file-lines fa-sm"></i>
                    <span id="charMemory_statFile">無角色</span>
                </div>
                <div class="charMemory_statItem" title="已存儲的記憶條目總數">
                    <i class="fa-solid fa-brain fa-sm"></i>
                    <span id="charMemory_statCount">0 條記憶</span>
                </div>
                <div class="charMemory_statItem" title="自上次提取以來的新消息 / 自動提取閾值">
                    <i class="fa-solid fa-arrows-rotate fa-sm"></i>
                    <span id="charMemory_statProgress">0/10 條訊息</span>
                </div>
                <div class="charMemory_statItem" title="距離下次允許自動提取的剩餘時間">
                    <i class="fa-solid fa-clock fa-sm"></i>
                    <span id="charMemory_statCooldown">就緒</span>
                </div>
                <div class="charMemory_statItem charMemory_statHealth" id="charMemory_statHealth"
                     title="注入健康狀態 — 點擊查看詳情">
                    <span class="charMemory_healthDot" id="charMemory_healthDot"></span>
                    <span id="charMemory_healthLabel">&mdash;</span>
                </div>
            </div>

            <!-- Primary Controls -->
            <div class="charMemory_dashSection">
                <div class="charMemory_buttonRow">
                    <input type="button" id="charMemory_extractNow" class="menu_button" value="立即提取" title="從未處理的消息中提取記憶。如果所有消息都已處理，請先使用「重置提取狀態」從頭開始重新讀取。" />
                    <button id="charMemory_autoExtractPill" class="charMemory_autoPill" title="切換自動提取 — 開啟時，在設定數量的新消息後自動提取記憶">
                        <i class="fa-solid fa-arrows-rotate fa-xs"></i> 自動
                    </button>
                    <input type="button" id="charMemory_manageMemories" class="menu_button" value="查看/編輯" title="瀏覽、編輯和刪除已存儲的個別記憶" />
                </div>
            </div>

            <!-- Tool Launchers -->
            <div class="charMemory_dashSection">
                <small class="charMemory_sectionLabel">數據庫工具</small>
                <div class="charMemory_buttonRow">
                    <input type="button" id="charMemory_filesPopover" class="menu_button" value="數據庫" title="瀏覽和管理此角色的數據庫文件" />
                    <input type="button" id="charMemory_consolidateBtn" class="menu_button" value="整合" title="使用 LLM 合併重複和相關的記憶" />
                    <input type="button" id="charMemory_batchBtn" class="menu_button" value="批量處理" title="一次對多個聊天執行提取" />
                    <input type="button" id="charMemory_formatBtn" class="menu_button" value="重新格式化" title="重新格式化記憶文件結構以提高檢索效率" />
                </div>
            </div>

            <!-- Activity (mini log) -->
            <div class="charMemory_dashSection">
                <small class="charMemory_sectionLabel">活動</small>
                <div id="charMemory_dashActivity" class="charMemory_dashActivity">
                    <div class="charMemory_diagEmpty charMemory_miniLogEmpty">尚無活動。</div>
                </div>
                <a id="charMemory_viewFullLog" class="charMemory_link">查看完整日誌 &rarr;</a>
            </div>

            <!-- Diagnostics summary -->
            <div class="charMemory_dashSection">
                <div class="charMemory_dashDiagHeader">
                    <small class="charMemory_sectionLabel">診斷</small>
                </div>
                <div id="charMemory_dashDiagSummary">
                    <div class="charMemory_diagEmpty">尚無診斷信息。</div>
                </div>
                <a id="charMemory_viewDiagDetails" class="charMemory_link">查看詳情 &rarr;</a>
            </div>

        </div>
    </div>
</div>
